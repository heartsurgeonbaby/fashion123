<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0b0b;
    color:#cfcfcf;
    font-family:Consolas, "Courier New", monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        repeating-linear-gradient(
            180deg,
            rgba(255,255,255,.02) 0px,
            rgba(255,255,255,.02) 1px,
            transparent 2px,
            transparent 4px
        );
    pointer-events:none;
    opacity:.4;
}

.container{
    width:min(760px,92%);
    border:1px solid #444;
    background:#111;
    box-shadow:0 0 35px rgba(255,255,255,.05);
}

.header{
    border-bottom:1px solid #333;
    padding:18px 22px;
    background:#171717;
}

.header h1{
    color:#ececec;
    letter-spacing:5px;
    font-size:26px;
}

.header p{
    margin-top:8px;
    color:#777;
    font-size:13px;
}

.archive{
    padding:20px;
}

.entry{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    margin-bottom:12px;
    border:1px solid #2f2f2f;
    background:#0d0d0d;
    text-decoration:none;
    color:#d8d8d8;
    transition:.25s;
}

.entry:hover{
    border-color:#7d7d7d;
    background:#161616;
    transform:translateX(5px);
}

.left{
    display:flex;
    align-items:center;
    gap:14px;
}

.icon{
    font-size:22px;
}

.filename{
    font-size:16px;
}

.meta{
    color:#666;
    font-size:12px;
}

.footer{
    border-top:1px solid #333;
    padding:16px 22px;
    color:#555;
    font-size:12px;
}

.cursor{
    animation:blink 1s steps(2,end) infinite;
}

@keyframes blink{
    50%{opacity:0;}
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>ARCHIVE</h1>
        <p>Recovered Directory Index // Access Level: Public</p>
    </div>

    <div class="archive">

        <a class="entry" href="00_baddream123a/index.html">
            <div class="left">
                <div class="icon">📁</div>
                <div class="filename">00_baddream123a</div>
            </div>
            <div class="meta">OPEN ▶</div>
        </a>

        <a class="entry" href="00_runforyourlife123a/index.html">
            <div class="left">
                <div class="icon">📁</div>
                <div class="filename">00_runforyourlife123a</div>
            </div>
            <div class="meta">OPEN ▶</div>
        </a>

    </div>

    <div class="footer">
        archive://root/<span class="cursor">_</span>
    </div>

</div>

</body>
</html>
